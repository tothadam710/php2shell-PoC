services:
  php-vuln-app:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - APACHE_RUN_USER=www-data
    networks:
      - evilnet

  kali:
    build:
      context: ./kali
    container_name: kali-lab
    stdin_open: true
    tty: true
    command: [ "bash" ]
    networks:
      - evilnet

networks:
  evilnet:
    driver: bridge
